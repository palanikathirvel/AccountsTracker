# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/accountant_tracker?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Kathirvel@2005}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Scheduler / Watcher Agent Configuration (overdue check rate in milliseconds: 15000 = 15s)
scheduler.overdue-check-rate=15000
scheduler.reminder-cooldown-minutes=10
scheduler.enabled=true

# Spring Mail (Gmail SMTP configuration for kathirvelpalani294@gmail.com)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=kathirvelpalani294@gmail.com
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

# Logging
logging.level.com.example.accountanttracker=INFO

# Google Gemini Generative AI Configuration
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-flash-lite-latest}

# Import local development properties if present (gitignored)
spring.config.import=optional:classpath:application-local.properties


